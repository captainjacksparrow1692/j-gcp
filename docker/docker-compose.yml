services:
  app:
    build: .
    container_name: j-gcp-app

    ports:
      - "8080:8080"

    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/postgres
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: 9376570167

    restart: always

    networks:
      - j-gcp-network

networks:
  j-gcp-network:
    external: true
    name: j-gcp-network